name: CI/CD

on:
  push:
    branches: ["feature"]

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/onlinelearning
  COMPOSE_FILE: docker-compose.prod.yaml
  # Образ в GHCR. Важно: OWNER в нижнем регистре (GHCR чувствителен).
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/onlinelearning:latest

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 lms config users

      - name: Run tests
        run: pytest -q

  build_and_push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Можно вообще не хранить GHCR_USERNAME/GHCR_TOKEN, а использовать встроенный GITHUB_TOKEN:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            COMPOSE_FILE="${{ env.COMPOSE_FILE }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"

            echo "[1/7] Create deploy dir: ${DEPLOY_DIR}"
            sudo mkdir -p "${DEPLOY_DIR}"
            sudo chown "${USER}:${USER}" "${DEPLOY_DIR}"

            echo "[2/7] Ensure folders"
            mkdir -p "${DEPLOY_DIR}/nginx"

            echo "[3/7] Write compose + nginx.conf"
            cat > "${DEPLOY_DIR}/${COMPOSE_FILE}" <<'YAML'
            services:
              db:
                image: postgres:17-alpine
                env_file: [ .env.docker ]
                environment:
                  POSTGRES_DB: ${POSTGRES_DB}
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                  interval: 5s
                  timeout: 5s
                  retries: 20
                restart: unless-stopped

              redis:
                image: redis:7-alpine
                command: ["redis-server", "--appendonly", "yes"]
                volumes:
                  - redisdata:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 30
                restart: unless-stopped

              migrate:
                image: ${IMAGE_NAME}
                env_file: [ .env.docker ]
                depends_on:
                  db:
                    condition: service_healthy
                command: ["sh", "-lc", "python manage.py migrate --noinput"]
                restart: "no"

              web:
                image: ${IMAGE_NAME}
                env_file: [ .env.docker ]
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                  migrate:
                    condition: service_completed_successfully
                expose:
                  - "8000"
                command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
                restart: unless-stopped

              celery:
                image: ${IMAGE_NAME}
                env_file: [ .env.docker ]
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                  migrate:
                    condition: service_completed_successfully
                  web:
                    condition: service_started
                command: ["celery", "-A", "config", "worker", "-l", "info"]
                restart: unless-stopped

              celery_beat:
                image: ${IMAGE_NAME}
                env_file: [ .env.docker ]
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                  migrate:
                    condition: service_completed_successfully
                  web:
                    condition: service_started
                command: ["celery", "-A", "config", "beat", "-l", "info"]
                restart: unless-stopped

              nginx:
                image: nginx:1.27-alpine
                depends_on:
                  web:
                    condition: service_started
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
                restart: unless-stopped

            volumes:
              pgdata:
              redisdata:
            YAML

            cat > "${DEPLOY_DIR}/nginx/nginx.conf" <<'NGINX'
            server {
                listen 80;
                server_name _;

                client_max_body_size 20m;

                location / {
                    proxy_pass http://web:8000;

                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_connect_timeout 10s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
            }
            NGINX

            echo "[4/7] Ensure .env.docker exists (do NOT overwrite)"
            if [ ! -f "${DEPLOY_DIR}/.env.docker" ]; then
              echo "ERROR: ${DEPLOY_DIR}/.env.docker not found."
              echo "Create it on server from .env.docker.sample and set real secrets."
              exit 1
            fi

            echo "[5/7] Login to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "[6/7] Pull & up (safe)"
            cd "${DEPLOY_DIR}"

            # ВАЖНО: передаём env-файл, иначе ${IMAGE_NAME} и др. могут не подставиться
            docker compose --env-file .env.docker -f "${COMPOSE_FILE}" pull
            docker compose --env-file .env.docker -f "${COMPOSE_FILE}" up -d --remove-orphans

            echo "[7/7] Show status"
            docker compose --env-file .env.docker -f "${COMPOSE_FILE}" ps