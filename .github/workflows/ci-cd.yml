name: CI/CD

on:
  push:
    branches: ["feature"]

permissions:
  contents: read

concurrency:
  group: onlinelearning-feature
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/onlinelearning
  COMPOSE_FILE: docker-compose.prod.yaml

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # тесты ходят в service postgres, а не в реальный прод
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-not-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      # если в проекте дергается Redis/SMTP/Stripe — даём безопасные заглушки:
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      SMTP_HOST: "localhost"
      SMTP_PORT: "25"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "False"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
      STRIPE_SUCCESS_URL: "http://localhost/success"
      STRIPE_CANCEL_URL: "http://localhost/cancel"

      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: test-secret-key

      CELERY_TASK_ALWAYS_EAGER: "True"
      CELERY_TASK_EAGER_PROPAGATES: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # prod-only flake8 (игнорим tests + migrations)
      - name: Run flake8 (prod only)
        run: |
          flake8 config lms users --exclude "*/migrations/*,*/tests/*,tests/*"

      # (опционально) чтобы не ловить race-condition
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d test_db && break
            sleep 1
          done

      - name: Run tests with coverage
        run: |
          python -m pytest -q \
            --cov=config --cov=lms --cov=users \
            --cov-report=term-missing:skip-covered \
            --cov-report=html \
            --cov-report=xml

      - name: Upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  deploy:
    name: Deploy to server (copy + docker compose up)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # known_hosts (без интерактива)
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy dir exists
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'SSH'
          set -euo pipefail
          sudo mkdir -p /opt/onlinelearning/.tmp
          sudo chown -R "$(id -un):$(id -gn)" /opt/onlinelearning
          SSH

      - name: Pack release (tracked files only)
        shell: bash
        run: |
          set -euo pipefail
          TAR="release_${GITHUB_SHA}.tar.gz"

          # только файлы из git (никаких htmlcov/.coverage/celerybeat-schedule и т.п.)
          git archive --format=tar.gz -o "$TAR" HEAD

          echo "TAR_NAME=$TAR" >> "$GITHUB_ENV"

      - name: Upload release to server
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${{ secrets.SSH_PORT }}" "${{ env.TAR_NAME }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_DIR }}/.tmp/${{ env.TAR_NAME }}"

      - name: Apply release on server (safe update)
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'SSH'
          set -euo pipefail

          DEPLOY_DIR="/opt/onlinelearning"
          TAR_PATH="$(ls -t "$DEPLOY_DIR/.tmp"/release_*.tar.gz | head -n 1)"
          STAGE_DIR="$DEPLOY_DIR/.tmp/stage_${RANDOM}_${RANDOM}"

          mkdir -p "$STAGE_DIR"
          tar -xzf "$TAR_PATH" -C "$STAGE_DIR"

          # обязательные файлы должны быть в релизе
          test -f "$STAGE_DIR/docker-compose.prod.yaml"
          test -f "$STAGE_DIR/Dockerfile"
          test -f "$STAGE_DIR/manage.py"

          # удаляем старый код (кроме .env.docker и .tmp)
          find "$DEPLOY_DIR" -maxdepth 1 -mindepth 1 \
            ! -name ".env.docker" \
            ! -name ".tmp" \
            -exec rm -rf {} +

          # переносим новый код
          cp -a "$STAGE_DIR/." "$DEPLOY_DIR/"

          # cleanup
          rm -rf "$STAGE_DIR"
          rm -f "$TAR_PATH"
          SSH

      - name: Verify .env.docker exists
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          'test -f /opt/onlinelearning/.env.docker'

      - name: Run deploy script
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'SSH'
          set -euo pipefail
          cd /opt/onlinelearning
            
          # sanity-check: нужные файлы реально на месте
          test -f deploy/deploy.sh || (echo "ERROR: deploy/deploy.sh missing in /opt/onlinelearning" && exit 1)
          test -f docker-compose.prod.yaml || (echo "ERROR: docker-compose.prod.yaml missing" && exit 1)
          test -f nginx/nginx.conf || (echo "ERROR: nginx/nginx.conf missing" && exit 1)
            
          # safety: убедимся, что compose не ссылается на deploy/nginx.conf
          if grep -q "deploy/nginx.conf" docker-compose.prod.yaml; then
            echo "ERROR: docker-compose.prod.yaml still references deploy/nginx.conf"
            exit 1
          fi
            
          bash deploy/deploy.sh
          SSH

      - name: Show status
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          'cd /opt/onlinelearning && docker compose -f docker-compose.prod.yaml --env-file .env.docker ps'