name: CI/CD

on:
  push:
    branches: ["feature"]

permissions:
  contents: read

concurrency:
  group: onlinelearning-deploy
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/onlinelearning
  SSH_PORT: "22"

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 lms config users

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to YandexCloud (rsync + docker compose)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Кладём приватный ключ в файл
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # Чтобы не было интерактива по known_hosts
      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy dir exists
        run: |
          ssh -p "${{ env.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "sudo mkdir -p '${{ env.DEPLOY_DIR }}' && sudo chown -R '${{ secrets.SSH_USER }}':'${{ secrets.SSH_USER }}' '${{ env.DEPLOY_DIR }}'"

      - name: Rsync project to server (safe)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude ".env.docker" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude ".idea" \
            --exclude ".pytest_cache" \
            --exclude ".mypy_cache" \
            --exclude "htmlcov" \
            --exclude ".coverage" \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Deploy on server (docker compose)
        run: |
          ssh -p "${{ env.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "bash -lc '${{ env.DEPLOY_DIR }}/deploy/deploy.sh'"