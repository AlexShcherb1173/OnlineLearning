name: CI/CD

on:
  push:
    branches: ["feature"]

permissions:
  contents: read

concurrency:
  group: onlinelearning-deploy
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/onlinelearning
  COMPOSE_FILE: docker-compose.prod.yaml

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 lms config users

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy (build on server)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare server dirs (safe)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'SSH'
          set -euo pipefail
          DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
          sudo mkdir -p "$DEPLOY_DIR"
          sudo chown -R "$USER:$USER" "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR/deploy"
          if [ ! -f "$DEPLOY_DIR/.env.docker" ]; then
            echo "ERROR: $DEPLOY_DIR/.env.docker not found. Create it on server (copy from .env.docker.sample)."
            exit 1
          fi
          SSH

      - name: Upload project to /opt/onlinelearning (exclude secrets)
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude ".env.docker" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude ".idea/" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Deploy with docker compose (safe up)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'SSH'
          set -euo pipefail
          DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
          COMPOSE_FILE="${{ env.COMPOSE_FILE }}"

          cd "$DEPLOY_DIR"

          echo "[1/4] Build images"
          docker compose -f "$COMPOSE_FILE" --env-file .env.docker build --no-cache

          echo "[2/4] Up (no downtime-ish)"
          docker compose -f "$COMPOSE_FILE" --env-file .env.docker up -d --remove-orphans

          echo "[3/4] Status"
          docker compose -f "$COMPOSE_FILE" ps

          echo "[4/4] Nginx test (inside container)"
          docker compose -f "$COMPOSE_FILE" exec -T nginx nginx -t
          SSH